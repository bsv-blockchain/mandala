# TS overlay — kept as the wire-parity reference for overlay-go, NOT the
# deployed stack. The default stack is overlay-go/docker-compose.yml (Go +
# MongoDB only). This TS engine additionally keeps its outputs in SQLite
# (SQLITE_FILE on the overlay-data volume). Both stacks use the same Mongo db
# name (`${NODE_NAME}_lookup_services`) and host port 27017, so bring only one
# up; against a shared Mongo, never run app traffic through both.
services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  overlay:
    build: .
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongodb:27017/mandala
    ports: ["8080:8080"]
    volumes: ["overlay-data:/data"]
    depends_on: ["mongodb"]
    # SIGTERM drains through OverlayExpress.close() with a 25s deadline
    # (src/shutdown.ts); compose must not SIGKILL before that deadline.
    stop_grace_period: 30s
volumes:
  mongo-data:
  overlay-data:
